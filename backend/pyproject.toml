[project]
name = "songuess-backend"
version = "0.1.0"
description = "Stateless FastAPI backend for Songuess"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic==2.10.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.12,<1",
    "uvicorn[standard]>=0.35,<1",
    "workers-py>=1.16.7",
    "workers-runtime-sdk>=1.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src", ".."]

[tool.uv]
package = false
