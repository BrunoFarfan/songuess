name: Apply D1 migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Wrangler environment to migrate
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read

jobs:
  migrate:
    if: |
      (github.ref == 'refs/heads/staging' && inputs.environment == 'preview') ||
      (github.ref == 'refs/heads/production' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: d1 migrations apply songuess-${{ inputs.environment }} --remote --env ${{ inputs.environment }}
